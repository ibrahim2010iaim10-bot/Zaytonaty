<!DOCTYPE html>
<html lang="ar" dir="rtl" id="main-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Zaytonaty</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <a href="index.html" class="logo">Zaytonaty 🛒</a>
        <a href="tel:+201234567890" class="contact-info"><span>📞 01234567890</span></a>
        <nav>
            <a href="products.html" data-tr="nav-back">العودة للتسوق</a>
            <button onclick="toggleLanguage()" class="lang-btn" id="lang-text">English</button>
        </nav>
    </header>

    <div class="container">
        <h2 data-tr="cart-title" style="text-align: center; margin-bottom: 30px;">محتويات السلة</h2>
        
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th data-tr="th-p">المنتج</th>
                        <th data-tr="th-pr">السعر</th>
                        <th data-tr="th-a">إجراء</th>
                    </tr>
                </thead>
                <tbody id="cart-body">
                    </tbody>
            </table>
        </div>

        <div style="text-align: center; margin: 30px 0;">
            <h3 style="font-size: 1.8rem;">
                <span data-tr="total-text">الإجمالي المستحق:</span> 
                <span id="total-price" style="color: #4CAF50;">0</span> 
                <span data-tr="currency">ج.م</span>
            </h3>
        </div>

        <div class="shipping-form">
            <h3 data-tr="ship-h3">📍 تفاصيل الشحن والتوصيل</h3>
            
            <input type="text" id="name" placeholder="الاسم بالكامل" data-p="p-name">
            <input type="tel" id="phone" placeholder="رقم الموبايل (واتساب)" data-p="p-phone">
            <input type="text" id="address" placeholder="العنوان بالتفصيل" data-p="p-address">
            
            <button class="cta-btn" id="confirm-btn" style="width: 100%">تأكيد الطلب وشحن المنتجات 🚀</button>
        </div>
    </div>

    <script type="module">
        // استيراد Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyBJX4iidOGIO_WiS6g-LFw89rrJ6ReInoM",
            authDomain: "zaytonaty-f4240.firebaseapp.com",
            projectId: "zaytonaty-f4240",
            appId: "1:268778198002:web:2803824e75be502f73916b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // الترجمة
        const tr = {
            ar: { "nav-back": "العودة للتسوق", "cart-title": "سلة المشتريات", "th-p": "المنتج", "th-pr": "السعر", "th-a": "إجراء", "total-text": "الإجمالي المستحق:", "currency": "ج.م", "ship-h3": "📍 تفاصيل الشحن والتوصيل", "p-name": "الاسم بالكامل", "p-phone": "رقم الموبايل (واتساب)", "p-address": "العنوان بالتفصيل" },
            en: { "nav-back": "Back to Shop", "cart-title": "Shopping Cart", "th-p": "Product", "th-pr": "Price", "th-a": "Action", "total-text": "Total Amount:", "currency": " EGP", "ship-h3": "📍 Shipping Details", "p-name": "Full Name", "p-phone": "Phone Number", "p-address": "Detailed Address" }
        };

        // وظيفة تبديل اللغة
        window.toggleLanguage = () => {
            const html = document.getElementById('main-html');
            const newLang = html.getAttribute('lang') === 'ar' ? 'en' : 'ar';
            html.setAttribute('lang', newLang); html.setAttribute('dir', newLang === 'ar' ? 'rtl' : 'ltr');
            document.getElementById('lang-text').innerText = newLang === 'ar' ? 'English' : 'العربية';
            document.querySelectorAll('[data-tr]').forEach(el => el.innerText = tr[newLang][el.getAttribute('data-tr')]);
            document.querySelectorAll('[data-p]').forEach(el => el.placeholder = tr[newLang][el.getAttribute('data-p')]);
            localStorage.setItem('pref-lang', newLang); loadCart();
        };

        // وظيفة تحميل السلة
        window.loadCart = () => {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const body = document.getElementById('cart-body');
            const lang = document.getElementById('main-html').getAttribute('lang');
            let total = 0;
            body.innerHTML = cart.map((item, i) => {
                total += item.price;
                return `<tr><td>${item.name}</td><td>${item.price}</td><td><button class="del-btn" onclick="removeItem(${i})">${lang==='ar'?'حذف':'Delete'}</button></td></tr>`;
            }).join('');
            document.getElementById('total-price').innerText = total;
        };

        // حذف منتج
        window.removeItem = (i) => {
            let cart = JSON.parse(localStorage.getItem('cart'));
            cart.splice(i, 1); 
            localStorage.setItem('cart', JSON.stringify(cart)); 
            loadCart();
        };

        // وظيفة إرسال الطلب (تم إصلاحها وتجربتها)
        const sendOrder = async () => {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const address = document.getElementById('address').value;
            const total = document.getElementById('total-price').innerText;
            const lang = document.getElementById('main-html').getAttribute('lang');

            // التأكد من وجود بيانات
            if (cart.length === 0) {
                alert(lang === 'ar' ? "السلة فارغة!" : "Cart is empty!");
                return;
            }
            if (!name || !phone || !address) {
                alert(lang === 'ar' ? "يرجى ملء جميع البيانات" : "Please fill all fields");
                return;
            }

            // إظهار حالة جاري الإرسال
            const btn = document.getElementById('confirm-btn');
            btn.innerText = lang === 'ar' ? "جاري الإرسال..." : "Sending...";
            btn.disabled = true;

            try {
                await addDoc(collection(db, "orders"), {
                    customer_name: name,
                    phone: phone,
                    address: address,
                    items: cart,
                    total: total,
                    status: "جديد", // لكي يظهر في صفحة الإدارة
                    date: new Date().toLocaleString('ar-EG')
                });

                alert(lang === 'ar' ? "تم استلام طلبك بنجاح! ✅" : "Order received successfully! ✅");
                localStorage.removeItem('cart'); // مسح السلة بعد النجاح
                window.location.href = "index.html"; // العودة للرئيسية

            } catch (error) {
                console.error("Error sending order: ", error);
                alert(lang === 'ar' ? "حدث خطأ أثناء الإرسال، حاول مرة أخرى" : "Error sending order, try again");
                btn.innerText = lang === 'ar' ? "تأكيد الطلب" : "Confirm Order";
                btn.disabled = false;
            }
        };

        // ربط الزر بالوظيفة
        document.getElementById('confirm-btn').addEventListener('click', sendOrder);

        // تشغيل الوظائف عند فتح الصفحة
        window.onload = () => { 
            if(localStorage.getItem('pref-lang') === 'en') toggleLanguage(); 
            loadCart(); 
        };
    </script>
</body>
</html>
