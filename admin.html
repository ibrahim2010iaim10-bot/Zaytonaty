<!DOCTYPE html>
<html lang="ar" dir="rtl" id="main-html">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Zaytonaty</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ألوان حالات الطلب */
        .status-badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; color: white; display: inline-block; }
        .status-new { background-color: #f39c12; }
        .status-process { background-color: #3498db; }
        .status-done { background-color: #27ae60; }
        
        select.status-select { padding: 5px; border-radius: 8px; border: 1px solid #ddd; font-family: 'Tajawal', sans-serif; cursor: pointer; }
        
        /* زر الحذف */
        .delete-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .delete-btn:hover { background-color: #c0392b; transform: scale(1.05); }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">Zaytonaty 🔒 Admin</a>
        <nav><button onclick="logout()" class="lang-btn" style="border-color:red; color:red;">تسجيل خروج</button></nav>
    </header>

    <div id="login-ui" class="container" style="text-align:center; padding-top:50px;">
        <div class="shipping-form" style="max-width:400px; margin:auto;">
            <h2>دخول المسؤول</h2>
            <input type="email" id="email" placeholder="البريد الإلكتروني">
            <input type="password" id="pass" placeholder="كلمة المرور">
            <button class="cta-btn" style="width:100%" onclick="login()">دخول</button>
        </div>
    </div>

    <div id="admin-ui" class="container" style="display:none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>إدارة الطلبات الواردة</h2>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>التاريخ</th>
                        <th>العميل</th>
                        <th>التفاصيل</th>
                        <th>الإجمالي</th>
                        <th>الحالة</th>
                        <th>تغيير الحالة</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="admin-body"></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBJX4iidOGIO_WiS6g-LFw89rrJ6ReInoM",
            authDomain: "zaytonaty-f4240.firebaseapp.com",
            projectId: "zaytonaty-f4240",
            appId: "1:268778198002:web:2803824e75be502f73916b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.login = () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            signInWithEmailAndPassword(auth, email, pass).catch(e => alert("خطأ في البيانات"));
        };

        window.logout = () => signOut(auth);

        // وظيفة تحديث الحالة
        window.updateStatus = async (orderId, newStatus) => {
            try {
                const orderRef = doc(db, "orders", orderId);
                await updateDoc(orderRef, { status: newStatus });
            } catch (e) { alert("حدث خطأ أثناء تحديث الحالة"); }
        };

        // وظيفة حذف الطلب (الجديدة)
        window.deleteOrder = async (orderId) => {
            if(confirm("هل أنت متأكد من حذف هذا الطلب نهائياً؟")) {
                try {
                    await deleteDoc(doc(db, "orders", orderId));
                } catch (e) { alert("حدث خطأ أثناء حذف الطلب"); }
            }
        };

        onAuthStateChanged(auth, user => {
            if(user) {
                document.getElementById('login-ui').style.display='none';
                document.getElementById('admin-ui').style.display='block';
                
                onSnapshot(query(collection(db, "orders"), orderBy("date", "desc")), s => {
                    document.getElementById('admin-body').innerHTML = s.docs.map(d => {
                        const o = d.data();
                        const id = d.id;
                        const status = o.status || "جديد";

                        let statusClass = "status-new";
                        if(status === "قيد التنفيذ") statusClass = "status-process";
                        if(status === "منتهي") statusClass = "status-done";

                        return `
                        <tr>
                            <td>${o.date}</td>
                            <td><strong>${o.customer_name}</strong><br><small>${o.phone}</small></td>
                            <td><small>${o.address}<br>(${o.items.map(i=>i.name).join(', ')})</small></td>
                            <td>${o.total} ج.م</td>
                            <td><span class="status-badge ${statusClass}">${status}</span></td>
                            <td>
                                <select class="status-select" onchange="updateStatus('${id}', this.value)">
                                    <option value="جديد" ${status === 'جديد' ? 'selected' : ''}> جديد</option>
                                    <option value="قيد التنفيذ" ${status === 'قيد التنفيذ' ? 'selected' : ''}>قيدالتنفيذ<option>
                                    <option value="منتهي" ${status === 'منتهي' ? 'selected' : ''}> منتهي</option>
                                </select>
                            </td>
                            <td>
                                <button class="delete-btn" onclick="deleteOrder('${id}')">🗑️ حذف</button>
                            </td>
                        </tr>`;
                    }).join('');
                });
            } else {
                document.getElementById('login-ui').style.display='block';
                document.getElementById('admin-ui').style.display='none';
            }
        });
    </script>
</body>
</html>
